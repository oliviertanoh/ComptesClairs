<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests — logique budget</title>
  <style>
    body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro", system-ui, sans-serif;
           max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1c2430; }
    h1 { font-size: 1.25rem; }
    .summary { font-weight: 700; padding: .75rem 1rem; border-radius: 12px; margin: 1rem 0; }
    .ok { background: #e7f4ee; color: #1c7a52; }
    .ko { background: #fbe9e9; color: #a83232; }
    ul { list-style: none; padding: 0; }
    li { padding: .35rem .5rem; border-bottom: 1px solid #eee; display: flex; gap: .5rem; }
    .mark { width: 1.2em; }
    .pass .mark { color: #2E9E6B; }
    .fail .mark { color: #D64545; }
    .fail { background: #fdf3f3; }
    code { color: #64748b; margin-left: auto; }
  </style>
</head>
<body>
  <h1>Tests — <code>money.js</code> + <code>budget.js</code></h1>
  <div id="out">Exécution…</div>
  <script type="module">
    import summary from './js/budget.test.js';
    const out = document.getElementById('out');
    const cls = summary.failed ? 'ko' : 'ok';
    const rows = summary.results.map((r) => `
      <li class="${r.ok ? 'pass' : 'fail'}">
        <span class="mark">${r.ok ? '✓' : '✗'}</span>
        <span>${r.name}</span>
        ${r.ok ? '' : `<code>attendu ${r.expected}, obtenu ${r.actual}</code>`}
      </li>`).join('');
    out.innerHTML = `
      <div class="summary ${cls}">
        ${summary.passed}/${summary.total} tests OK${summary.failed ? ` — ${summary.failed} échec(s)` : ''}
      </div>
      <ul>${rows}</ul>`;
  </script>
</body>
</html>
